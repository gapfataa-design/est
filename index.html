<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Me quieres? ✨</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Pantalla inicial con la pregunta -->
    <div id="pantalla-inicio">
        <div class="caja-pregunta">
            <h2>¿Me quieres? ✨</h2>
            <div class="botones">
                <button id="btn-si" class="btn-opcion btn-si">Sí 💖</button>
                <button id="btn-no" class="btn-opcion btn-no">No 😢</button>
            </div>
        </div>
    </div>

    <!-- Lienzo para explosión y lluvia de estrellas -->
    <canvas id="canvas-estrellas"></canvas>

    <!-- Universo principal -->
    <div id="universo" class="universo oculto">
        <div class="estrellas"></div>

        <div class="galaxia">
            <div class="nucleo"></div>
            <div class="orbita orbita-1"><div class="planeta p1"></div></div>
            <div class="orbita orbita-2"><div class="planeta p2"></div></div>
            <div class="orbita orbita-3"><div class="planeta p3"></div></div>
        </div>

        <div class="tarjeta-amor">
            <h1>Look at the stars... ✨</h1>
            <p>
                Entre millones de estrellas, galaxias infinitas y constelaciones lejanas, 
                mi lugar favorito en todo el universo siempre será donde estés tú.
            </p>
            <div class="controles-audio">
                <button id="btn-pausa" class="btn-mini">⏸️ Pausar</button>
            </div>
        </div>
    </div>

    <!-- Audio de Yellow -->
    <audio id="musica" loop preload="auto">
        <source src="Coldplay - Yellow (Official Video).mp3" type="audio/mpeg">
        Tu navegador no soporta reproducción de audio HTML5.
    </audio>

    <script>
        const btnSi = document.getElementById("btn-si");
        const btnNo = document.getElementById("btn-no");
        const btnPausa = document.getElementById("btn-pausa");
        const pantallaInicio = document.getElementById("pantalla-inicio");
        const universo = document.getElementById("universo");
        const audio = document.getElementById("musica");
        const canvas = document.getElementById("canvas-estrellas");
        const ctx = canvas.getContext("2d");

        function ajustarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        ajustarCanvas();
        window.addEventListener("resize", ajustarCanvas);

        // Convertir el botón "No" en "Sí" al acercar el cursor o tocarlo
        function transformarNoEnSi() {
            btnNo.textContent = "¡Sí! 💖";
            btnNo.classList.remove("btn-no");
            btnNo.classList.add("btn-si");
        }

        btnNo.addEventListener("mouseover", transformarNoEnSi);
        btnNo.addEventListener("touchstart", transformarNoEnSi, { passive: true });

        let particulasExplosion = [];
        let lluviaEstrellas = [];
        let animacionActiva = false;

        const colores = ["#ffffff", "#ffecd2", "#fcb69f", "#ffd166", "#a18cd1", "#fbc2eb", "#8fd3f4"];

        class ParticulaExplosion {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angulo = Math.random() * Math.PI * 2;
                const velocidad = Math.random() * 15 + 3;
                this.vx = Math.cos(angulo) * velocidad;
                this.vy = Math.sin(angulo) * velocidad;
                this.radio = Math.random() * 3 + 1;
                this.color = colores[Math.floor(Math.random() * colores.length)];
                this.alfa = 1;
                this.friccion = 0.96;
            }

            actualizar() {
                this.vx *= this.friccion;
                this.vy *= this.friccion;
                this.x += this.vx;
                this.y += this.vy;
                this.alfa -= 0.01;
            }

            dibujar() {
                ctx.save();
                ctx.globalAlpha = Math.max(this.alfa, 0);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radio, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class EstrellaCayendo {
            constructor() {
                this.reiniciar(true);
            }

            reiniciar(inicial = false) {
                this.x = Math.random() * canvas.width * 1.3;
                this.y = inicial ? Math.random() * canvas.height : -20;
                this.longitud = Math.random() * 80 + 30;
                this.velocidad = Math.random() * 6 + 4;
                this.grosor = Math.random() * 2 + 0.5;
                this.color = colores[Math.floor(Math.random() * colores.length)];
                this.alfa = Math.random() * 0.7 + 0.3;
            }

            actualizar() {
                this.x -= this.velocidad * 0.6;
                this.y += this.velocidad;
                if (this.y > canvas.height + 50 || this.x < -50) {
                    this.reiniciar(false);
                }
            }

            dibujar() {
                ctx.save();
                ctx.globalAlpha = this.alfa;
                const gradiente = ctx.createLinearGradient(
                    this.x, this.y,
                    this.x + this.longitud * 0.6, this.y - this.longitud
                );
                gradiente.addColorStop(0, this.color);
                gradiente.addColorStop(1, "transparent");

                ctx.strokeStyle = gradiente;
                ctx.lineWidth = this.grosor;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + this.longitud * 0.6, this.y - this.longitud);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.grosor + 0.5, 0, Math.PI * 2);
                ctx.fillStyle = "#fff";
                ctx.fill();
                ctx.restore();
            }
        }

        function reproducirCancion() {
            audio.currentTime = 0;
            audio.volume = 0.9;
            const promesa = audio.play();
            if (promesa !== undefined) {
                promesa.catch(error => {
                    console.warn("Reproducción bloqueada o archivo no encontrado:", error);
                    btnPausa.textContent = "▶️ Reproducir";
                });
            }
        }

        function iniciarEscena() {
            if (animacionActiva) return;
            animacionActiva = true;

            reproducirCancion();

            pantallaInicio.classList.add("desvanecer");
            setTimeout(() => {
                pantallaInicio.style.display = "none";
            }, 600);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            for (let i = 0; i < 320; i++) {
                particulasExplosion.push(new ParticulaExplosion(cx, cy));
            }
            for (let i = 0; i < 80; i++) {
                lluviaEstrellas.push(new EstrellaCayendo());
            }

            animarCanvas();

            setTimeout(() => {
                universo.classList.remove("oculto");
                universo.classList.add("visible");
            }, 350);
        }

        function animarCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particulasExplosion.forEach((p, idx) => {
                p.actualizar();
                p.dibujar();
                if (p.alfa <= 0) particulasExplosion.splice(idx, 1);
            });

            lluviaEstrellas.forEach(estrella => {
                estrella.actualizar();
                estrella.dibujar();
            });

            requestAnimationFrame(animarCanvas);
        }

        btnSi.addEventListener("click", iniciarEscena);
        btnNo.addEventListener("click", () => {
            transformarNoEnSi();
            iniciarEscena();
        });

        btnPausa.addEventListener("click", () => {
            if (audio.paused) {
                audio.play();
                btnPausa.textContent = "⏸️ Pausar";
            } else {
                audio.pause();
                btnPausa.textContent = "▶️ Reproducir";
            }
        });
    </script>
</body>
</html>
